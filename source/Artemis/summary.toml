# Neutron source summary (TOML; read it in Python with tomllib)

[run]
name                    = "Artemis"
code_version            = "cbd4ed1c2c64a419f4e131b66abe885508f0cd3a"
code_url                = "https://github.com/lucasjacobson/beam-target"
created                 = "2026-11-23T04:54:44+00:00"
input_file              = "source/artemis.toml"
sdef_direction          = "-z"
sdef_entry_position     = [0.0, 0.0, 137.0]
sdef_backstop_position  = [0.0, 0.0, 0.0]

[inputs]
beam                    = "deuteron"       # beam particle
beam_energy_entry       = 280.0            # keV
beam_current            = 45.0             # mA
region                  = ["chamber"]      # per region: names (if any)
material                = ["DT50"]         # per region; see [materials]
pressure                = [nan]            # torr; nan where unused
temperature             = [nan]            # degC; nan where unused
density                 = [1.470355e-06]   # g/cm3, calculated for region 1; nan where unused
length                  = [137.0]          # cm
beam_energy_backstop    = 10.0             # keV, requested
beam_radius_entry       = 0.2              # cm
wall_radius             = [5.4483]         # cm
divergence              = [36.0]           # mrad
position_bins           = [137]
position_substeps       = [10]             # per position bin
angle_bin_width         = 1.0              # deg
energy_bin_width        = 0.01             # MeV
stopping_power          = "icru49"
nuclear_data            = ["drosg"]        # libraries, searched in order
nuclear_data_dirs       = ["drosg"]        # where they were found

[results]
yield_total             = 1.748845e+13     # n/s
yield_DD                = 1.664335e+11     # n/s, D(d,n)3He
yield_DT                = 1.732202e+13     # n/s, T(d,n)4He
fraction_DD             = 0.009516767      # share of the total yield
fraction_DT             = 0.9904832        # share of the total yield
mean_neutron_energy     = 14.00358         # MeV, all reactions and angles
mean_neutron_energy_DD  = 2.547295         # MeV, over all angles
mean_neutron_energy_DT  = 14.11365         # MeV, over all angles
atom_density            = [3.520643e+17]   # atoms/cm3, in each region
beam_energy_region_end  = [10.0]           # keV, at the end of each region
beam_energy_backstop    = 10.0             # keV
beam_radius_backstop    = 5.132            # cm, beam edge; capped at the wall
beam_current_backstop   = 45.0             # mA, after scraping and nuclear losses
beam_power_entry        = 12.6             # kW
beam_power_deposited    = 12.15            # kW, deposited in the target material (gas or solid)
beam_power_wall         = 0.0              # kW, carried onto the wall by scraping
beam_power_backstop     = 0.45             # kW
beam_power_nuclear      = 0.0              # kW, of the deposited power: beam lost to nuclear reactions
beam_nuclear_loss       = 0.0              # fraction of the beam removed by nuclear reactions
neutron_scrape_fraction = 0.0              # neutrons lost to scraping

[materials.DT50]
phase                   = "gas"
molecules               = { D2 = 0.5, T2 = 0.5 }

[reactions.DD]
reaction                = "D(d,n)3He"
data                    = "DROSG-2000 v12.01, d2hags.koe"

[reactions.DT]
reaction                = "T(d,n)4He"
data                    = "DROSG-2000 v12.01, d3hags.koe"
